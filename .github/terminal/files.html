<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Files</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23000000'/%3E%3Cpath d='M12 20h14l5 6h21v22H12z' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens (same system as the terminal UI) */
:root{
  --bg:#000; --bar:#000; --panel:#000; --raise:#000;
  --line:rgba(255,255,255,.18); --line2:rgba(255,255,255,.34);
  --txt:#fff; --muted:rgba(255,255,255,.65); --dim:rgba(255,255,255,.42);
  --ok:#2fd27f; --warn:#f5b942; --bad:#ff5c5c; --r:2px;
  --top:46px; --mono:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono","Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
::selection{background:rgba(255,255,255,.25)}
[hidden]{display:none!important}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}

/* ---------------------------------------------------------------- top bar */
#top{position:relative;z-index:30;display:flex;align-items:center;gap:9px;
  height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 9px 0;
  background:var(--bar);border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:var(--muted);
  font-size:12.5px;font-weight:600;letter-spacing:.1px}
.brand svg{display:block;width:19px;height:19px;color:rgba(255,255,255,.5)}
.brand .ac{stroke:#fff}
.brand .divider{width:1px;height:18px;margin-left:9px;background:var(--line2)}
#crumbs{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:2px;height:100%;
  overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#crumbs::-webkit-scrollbar{display:none}
.crumb{flex:0 0 auto;padding:5px 7px;border:1px solid transparent;border-radius:var(--r);
  background:none;color:var(--muted);font-size:12.5px;cursor:pointer}
.crumb:hover{color:var(--txt);background:#ffffff0b}
.crumb.last{color:var(--txt);border-color:var(--line2);font-weight:600}
.csep{flex:0 0 auto;color:var(--dim);font-size:11px;padding:0 1px}
.actions{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.ib{display:grid;place-items:center;width:31px;height:31px;padding:0;border:1px solid transparent;
  border-radius:var(--r);background:transparent;color:var(--muted);cursor:pointer;
  transition:background .13s,color .13s,border-color .13s;text-decoration:none}
.ib:hover{background:#ffffff0b;color:var(--txt)}
.ib:active{background:#ffffff12}
.ib.on{background:#fff;border-color:#fff;color:#000}
.ib svg{width:17px;height:17px}
.ib:focus-visible,.crumb:focus-visible,.mi:focus-visible,.btn:focus-visible,
.row:focus-visible,.pick:focus-visible{outline:2px solid #fff;outline-offset:1px}

/* menu */
#menu{position:absolute;top:calc(var(--top) + env(safe-area-inset-top) + 5px);right:9px;z-index:50;
  width:252px;padding:6px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 18px 40px #000b,0 2px 10px #0008}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 9px;border:0;
  border-radius:var(--r);background:none;color:var(--txt);font-size:12.5px;text-align:left;cursor:pointer}
.mi:hover{background:#ffffff0a}
.mi svg{flex:0 0 auto;width:15px;height:15px;color:var(--dim)}
.mi .chk{margin-left:auto;color:#fff;font-size:12px}
.mi-sp{width:15px;flex:0 0 15px}
.sep{height:1px;margin:5px 6px;background:var(--line)}

/* ---------------------------------------------------------------- sub bar */
#subbar{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--line);
  background:var(--bar);min-height:40px;flex-wrap:wrap}
#search{flex:1 1 220px;display:flex;align-items:center;gap:7px;min-width:140px;max-width:420px;
  height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:var(--r);background:#000}
#search:focus-within{border-color:#fff}
#search svg{width:14px;height:14px;color:var(--dim);flex:0 0 auto}
#q{flex:1 1 auto;min-width:0;border:0;outline:0;background:none;color:var(--txt);font-size:12.5px}
#q::placeholder{color:var(--dim)}
#count{color:var(--dim);font-size:12px;white-space:nowrap}
#selbar{display:flex;align-items:center;gap:7px;margin-left:auto}
#selbar.hide{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 11px;
  border:1px solid var(--line2);border-radius:var(--r);background:#000;color:var(--txt);
  font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fff;color:#000;border-color:#fff}
.btn.primary{background:#fff;color:#000;border-color:#fff;font-weight:600}
.btn.primary:hover{background:#e4e4e4;border-color:#e4e4e4}
.btn.danger:hover{background:#fff;border-color:#fff;color:#000}
.btn svg{width:13px;height:13px}

/* ---------------------------------------------------------------- list */
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#scroll{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) #000}
#scroll::-webkit-scrollbar{width:10px;height:10px}
#scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border:2px solid #000;border-radius:0}
#scroll::-webkit-scrollbar-track{background:transparent}
#thead{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:30px;padding:0 9px;
  background:#000;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;user-select:none}
#thead .c-check{width:28px;flex:0 0 28px}
#thead .c-name{flex:1 1 auto;min-width:0;padding-left:4px;cursor:pointer}
#thead .c-size{width:90px;flex:0 0 90px;text-align:right;cursor:pointer;padding-right:10px}
#thead .c-time{width:158px;flex:0 0 158px;text-align:right;cursor:pointer;padding-right:10px}
#thead .c-act{width:92px;flex:0 0 92px}
#thead .sorted{color:var(--txt)}
#thead .arrow{margin-left:3px;font-size:9px}
.row{display:flex;align-items:center;height:34px;padding:0 9px;border-bottom:1px solid #ffffff0c;
  cursor:default;user-select:none;-webkit-user-select:none}
.row:hover{background:#ffffff08}
.row.sel{background:#ffffff12}
.row .c-check{width:28px;flex:0 0 28px;display:flex;align-items:center}
.pick{width:13px;height:13px;accent-color:#fff;margin:0;cursor:pointer}
.row .c-name{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding-left:4px;cursor:pointer}
.row .ic{flex:0 0 auto;display:grid;place-items:center;width:18px;height:18px;color:var(--dim)}
.row .ic svg{width:16px;height:16px}
.row.dir .ic{color:#fff}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .badge{flex:0 0 auto;padding:1px 4px;border:1px solid var(--line2);border-radius:var(--r);
  color:var(--dim);font-size:10px;text-transform:uppercase}
.row.dir .nm{color:#fff;font-weight:500}
.row .c-size{width:90px;flex:0 0 90px;text-align:right;color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums;padding-right:10px}
.row .c-time{width:158px;flex:0 0 158px;text-align:right;color:var(--dim);font-size:12px;
  padding-right:10px;white-space:nowrap}
.row .c-act{width:92px;flex:0 0 92px;display:flex;align-items:center;justify-content:flex-end;gap:1px}
.act{display:grid;place-items:center;width:27px;height:27px;padding:0;border:0;border-radius:var(--r);
  background:none;color:var(--dim);cursor:pointer;opacity:0}
.row:hover .act,.row:focus-within .act{opacity:1}
.act:hover{background:#ffffff14;color:#fff}
.act.del:hover{color:#fff}
.act svg{width:14px;height:14px}
#none{display:grid;place-content:center;justify-items:center;gap:6px;padding:48px 20px;
  color:var(--dim);text-align:center}
#none svg{width:34px;height:34px;color:var(--dim)}
#none b{color:var(--txt);font-weight:600;font-size:13px}

/* ---------------------------------------------------------------- footer */
#foot{display:flex;align-items:center;gap:10px;height:28px;padding:0 9px;flex:0 0 auto;
  border-top:1px solid var(--line);background:var(--bar);color:var(--dim);font-size:11.5px}
#foot .grow{flex:1 1 auto}
.dot{width:6px;height:6px;border-radius:1px;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(47,210,127,.55)}
.dot.busy{background:var(--warn);animation:pulse 1.1s infinite}
.dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
#conn{color:var(--muted)}

/* ---------------------------------------------------------------- toasts / uploads */
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:120;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:86vw}
.toast{max-width:100%;padding:7px 12px;border:1px solid var(--line2);border-radius:var(--r);
  background:#000;color:var(--txt);font-size:12px;box-shadow:0 10px 30px #000;word-break:break-word}
.toast.err{border-left:3px solid #fff}
.toast.ok{border-color:rgba(255,255,255,.5)}
#ups{position:fixed;right:10px;bottom:38px;z-index:110;width:310px;max-width:calc(100vw - 20px);
  border:1px solid var(--line2);border-radius:var(--r);background:#000;box-shadow:0 16px 40px #000c}
#ups header{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--muted)}
#ups header b{color:var(--txt);font-weight:600}
#ups .grow{flex:1 1 auto}
#ups .list{max-height:190px;overflow:auto}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 9px;border-bottom:1px solid #ffffff0c;font-size:11.5px}
.up .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.up .p{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.up .bar{grid-column:1/-1;height:2px;background:rgba(255,255,255,.14);border-radius:1px;overflow:hidden}
.up .bar i{display:block;height:100%;width:0;background:#fff;transition:width .12s}
.up.done .bar i{background:#fff}
.up.err .bar i{background:#fff}

/* drop overlay */
#drop{position:absolute;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;gap:8px;
  background:#000d;border:1px dashed #fff;color:var(--txt);font-size:13px;pointer-events:none}
#drop svg{width:34px;height:34px;color:#fff}
#drop small{color:var(--muted)}

/* ---------------------------------------------------------------- modal */
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:#000c}
.dialog{width:420px;max-width:100%;border:1px solid var(--line2);border-radius:var(--r);background:#000;
  box-shadow:0 24px 60px #000}
.dialog h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.dialog .body{padding:14px;color:var(--muted);font-size:12.5px;line-height:1.7}
.dialog .body strong{color:var(--txt);font-weight:600}
.dialog input{width:100%;height:32px;margin-top:9px;padding:0 9px;border:1px solid var(--line2);
  border-radius:var(--r);background:#000;color:var(--txt);outline:0}
.dialog input:focus{border-color:#fff}
.dialog .foot{display:flex;justify-content:flex-end;gap:7px;padding:10px 14px;border-top:1px solid var(--line)}
.dialog .names{margin:8px 0 0;padding:0;list-style:none;max-height:120px;overflow:auto;
  font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dialog .names li{padding:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------------------------------------------------------- editor */
#editor{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#000}
#editor header{display:flex;align-items:center;gap:8px;height:calc(42px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 9px 0;border-bottom:1px solid var(--line2);flex:0 0 auto}
#editor .fname{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;color:var(--txt)}
#editor .fname svg{width:15px;height:15px;color:var(--dim);flex:0 0 auto}
#editor .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#editor .meta{color:var(--dim);font-size:11px;white-space:nowrap}
#editor .grow{flex:1 1 auto}
#editor textarea{flex:1 1 auto;min-height:0;width:100%;padding:10px 12px;border:0;outline:0;resize:none;
  background:#000;color:var(--txt);font:12.5px/1.55 var(--mono);tab-size:2;white-space:pre;overflow:auto}
#editor .dirty{width:6px;height:6px;background:#fff;border-radius:1px;display:none}
#editor.dirty .dirty{display:block}

/* ---------------------------------------------------------------- preview */
#preview{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;background:#000}
#preview header{display:flex;align-items:center;gap:9px;height:calc(42px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 9px 0;border-bottom:1px solid var(--line2);flex:0 0 auto;font-size:12.5px}
#preview .grow{flex:1 1 auto}
#preview .wrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:18px;overflow:auto}
#preview img{max-width:100%;max-height:100%;object-fit:contain;background:#000;
  border:1px solid var(--line2);border-radius:var(--r)}

/* ---------------------------------------------------------------- narrow */
@media (max-width:760px){
  .brand .name,.brand .divider{display:none}
  #top{gap:5px;padding-left:6px;padding-right:6px}
  #thead .c-size,#thead .c-time{display:none}
  .row{height:44px}
  .row .c-size,.row .c-time{display:none}
  .row .c-name{gap:7px}
  .row .c-act{width:92px;flex:0 0 92px}
  .act{opacity:1}
  #foot{height:26px}
  #subbar{padding:6px}
  #search{max-width:none}
  .dialog .foot{flex-wrap:wrap}
}
@media (hover:none){.act{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="ac" d="M1.8 5.6h5.4l1.7 2h9.3v8.6H1.8z"/>
      </svg>
      <span class="name">Files</span>
      <span class="divider"></span>
    </div>
    <nav id="crumbs" aria-label="Path"></nav>
    <div class="actions">
      <button class="ib" id="bUpload" title="Upload files" aria-label="Upload files"></button>
      <button class="ib" id="bMkdir" title="New folder" aria-label="New folder"></button>
      <button class="ib" id="bRefresh" title="Refresh" aria-label="Refresh"></button>
      <button class="ib" id="bMenu" title="Options" aria-label="Options" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <div id="menu" role="menu" hidden>
      <button class="mi" id="mDownload" role="menuitem"></button>
      <button class="mi" id="mHidden" role="menuitem">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8S4 4 8 4s6.5 4 6.5 4-2.5 4-6.5 4S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.9"/></svg>
        <span>Show hidden files</span><span class="chk" id="chkHidden">✓</span></button>
      <button class="mi" id="mSelectAll" role="menuitem"></button>
      <div class="sep"></div>
      <button class="mi" id="mSortName" role="menuitem"><span class="mi-sp"></span><span>Sort by name</span><span class="chk" data-sort-chk="name"></span></button>
      <button class="mi" id="mSortSize" role="menuitem"><span class="mi-sp"></span><span>Sort by size</span><span class="chk" data-sort-chk="size"></span></button>
      <button class="mi" id="mSortTime" role="menuitem"><span class="mi-sp"></span><span>Sort by modified</span><span class="chk" data-sort-chk="mtime"></span></button>
      <div class="sep"></div>
      <button class="mi" id="mTerminal" role="menuitem"></button>
    </div>
  </header>

  <div id="subbar">
    <div id="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/></svg>
      <input id="q" placeholder="Filter in this folder…" autocomplete="off" spellcheck="false" dir="auto">
    </div>
    <span id="count"></span>
    <div id="selbar" class="hide">
      <button class="btn" id="bClearSel">Clear</button>
      <button class="btn danger" id="bDelSel">Delete selected</button>
    </div>
  </div>

  <main id="stage">
    <div id="scroll">
      <div id="thead">
        <span class="c-check"><input class="pick" type="checkbox" id="selAll" aria-label="Select all"></span>
        <span class="c-name" data-sort="name">Name</span>
        <span class="c-size" data-sort="size">Size</span>
        <span class="c-time" data-sort="mtime">Modified</span>
        <span class="c-act"></span>
      </div>
      <div id="rows"></div>
      <div id="none" hidden></div>
    </div>
    <div id="drop" hidden></div>
  </main>

  <footer id="foot">
    <span id="stat"></span>
    <span class="grow"></span>
    <span class="dot" id="dot"></span><span id="conn">connecting…</span>
  </footer>
</div>

<div id="toasts"></div>
<div id="ups" hidden>
  <header><b>Uploads</b><span class="grow"></span><span id="upSum"></span></header>
  <div class="list" id="upList"></div>
</div>

<div id="modal" hidden></div>

<section id="editor" hidden>
  <header>
    <div class="fname"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 1.8h5l3 3v9.4H4z"/><path d="M9 1.8v3h3"/></svg><span id="eName" dir="auto"></span></div>
    <span class="meta" id="eMeta"></span>
    <span class="dirty" title="Unsaved changes"></span>
    <span class="grow"></span>
    <button class="btn" id="eDownload">Download</button>
    <button class="btn primary" id="eSave">Save</button>
    <button class="btn" id="eClose">Close</button>
  </header>
  <textarea id="eText" spellcheck="false" autocomplete="off"></textarea>
</section>

<section id="preview" hidden>
  <header>
    <span id="pName" dir="auto"></span><span class="grow"></span>
    <button class="btn" id="pDownload">Download</button>
    <button class="btn" id="pClose">Close</button>
  </header>
  <div class="wrap"><img id="pImg" alt=""></div>
</section>

<input id="fileInput" type="file" multiple hidden>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) { n.textContent = text; n.dir = 'auto'; }
  return n;
};
const BASE = '/files';
const enc = encodeURIComponent;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const joinPath = (a, b) => (a ? a.replace(/\/$/, '') + '/' + b : b);
const fmtSize = n => {
  if (!n) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
};
const fmtDate = ms => {
  if (!ms) return '—';
  const d = new Date(ms);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return d.toLocaleString(undefined, sameYear
    ? { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
    : { year: 'numeric', month: 'short', day: 'numeric' });
};
const extOf = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i).toLowerCase() : ''; };
const TEXT_EXT = new Set(['.txt','.md','.markdown','.json','.jsonc','.js','.jsx','.ts','.tsx','.mjs','.cjs',
  '.css','.scss','.less','.html','.htm','.xml','.svg','.yml','.yaml','.toml','.ini','.conf','.cfg','.env',
  '.py','.rb','.go','.rs','.c','.h','.cc','.cpp','.hpp','.java','.kt','.kts','.sh','.bash','.zsh','.fish',
  '.sql','.graphql','.gql','.php','.lua','.swift','.cs','.vue','.svelte','.dockerfile','.gitignore',
  '.gitattributes','.editorconfig','.log','.csv','.tsv','.tex','.gradle','.properties','.plist','.r','.m',
  '.makefile','.mk','.bat','.ps1','.diff','.patch']);
const IMAGE_EXT = new Set(['.png','.jpg','.jpeg','.gif','.webp','.avif','.bmp','.ico','.svg']);
const isText = n => TEXT_EXT.has(extOf(n)) || ['Makefile','Dockerfile','LICENSE','README','.gitignore','.env','.bashrc','.profile'].includes(n);

const ICONS = {

/* ---------------------------------------------------------------- state */
const state = {
  cwd: '',
  entries: [],
  sort: {
    key: ['name', 'size', 'mtime'].includes(store.get('files.sort')) ? store.get('files.sort') : 'name',
    dir: store.get('files.dir') === '-1' ? -1 : 1,
  },
  hidden: store.get('files.hidden') === '1',
  filter: '',
  selected: new Set(),
  editor: null,
  uploads: [],
};

/* ---------------------------------------------------------------- api */
async function api(path, opts = {}) {
  const headers = { 'X-Files': '1', ...(opts.headers || {}) };
  let res;
  try {
    res = await fetch(BASE + path, { cache: 'no-store', ...opts, headers });
  } catch {
    setConn('bad');
    throw new Error('cannot reach the file server');
  }
  setConn('ok');
  if (!res.ok) {
    let msg = res.statusText || ('HTTP ' + res.status);
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return res.headers.get('content-type')?.includes('json') ? res.json() : res.text();
}

/* ---------------------------------------------------------------- status */
const dot = $('#dot'), conn = $('#conn');
let connTimer = 0;
function setConn(st) {
  dot.className = 'dot' + (st === 'ok' ? ' ok' : st === 'bad' ? ' bad' : st === 'busy' ? ' busy' : '');
  conn.textContent = st === 'ok' ? 'online' : st === 'bad' ? 'offline' : st === 'busy' ? 'working…' : 'connecting…';
  if (st !== 'busy') { clearTimeout(connTimer); connTimer = setTimeout(ping, 15000); }
}
async function ping() {
  try {
    const opts = { cache: 'no-store' };
    if (AbortSignal.timeout) opts.signal = AbortSignal.timeout(5000);
    const r = await fetch(BASE + '/api/health', opts);
    setConn(r.ok ? 'ok' : 'bad');
  } catch { setConn('bad'); }
}

/* ---------------------------------------------------------------- toasts */
function toast(msg, kind = '') {
  const n = el('div', 'toast' + (kind ? ' ' + kind : ''), msg);
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstElementChild.remove();
  box.appendChild(n);
  setTimeout(() => { n.style.opacity = '0'; setTimeout(() => n.remove(), 250); }, 3600);
}

/* ---------------------------------------------------------------- modal */
function dialog({ title, body, input, value = '', ok = 'OK', danger = false, names = [] }) {
  return new Promise(resolve => {
    const m = $('#modal');
    m.hidden = false;
    m.innerHTML = '';
    const box = el('div', 'dialog');
    box.appendChild(el('h2', '', title));
    const b = el('div', 'body');
    if (body) b.appendChild(el('div', '', body));
    if (names.length) {
      const ul = el('ul', 'names');
      names.slice(0, 8).forEach(n => ul.appendChild(el('li', '', n)));
      if (names.length > 8) ul.appendChild(el('li', '', `… and ${names.length - 8} more`));
      b.appendChild(ul);
    }
    let field = null;
    if (input) {
      field = el('input');
      field.dir = 'auto';
      field.value = value;
      field.spellcheck = false;
      field.autocomplete = 'off';
      b.appendChild(field);
    }
    box.appendChild(b);
    const foot = el('div', 'foot');
    const cancel = el('button', 'btn', 'Cancel');
    const okb = el('button', 'btn ' + (danger ? 'danger' : 'primary'), ok);
    foot.append(cancel, okb);
    box.appendChild(foot);
    m.appendChild(box);
    const close = v => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', key); resolve(v); };
    const submit = () => close(input ? (field.value.trim() || null) : true);
    cancel.onclick = () => close(null);
    okb.onclick = submit;
    m.onclick = e => { if (e.target === m) close(null); };
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(null); }
      if (e.key === 'Enter' && (input || document.activeElement === okb)) { e.preventDefault(); submit(); }
    };
    document.addEventListener('keydown', key);
    setTimeout(() => { (field || okb).focus(); if (field) field.select(); }, 20);
  });
}
const confirmDialog = (title, body, names = []) => dialog({ title, body, ok: 'Delete', danger: true, names });
const promptDialog = (title, body, value = '', ok = 'Save') => dialog({ title, body, input: true, value, ok });

/* ---------------------------------------------------------------- rendering */
function crumbs() {
  const c = $('#crumbs');
  c.innerHTML = '';
  const parts = state.cwd ? state.cwd.split('/') : [];
  const root = el('button', 'crumb' + (parts.length ? '' : ' last'), 'workspaces');
  root.onclick = () => load('');
  c.appendChild(root);
  parts.forEach((p, i) => {
    c.appendChild(el('span', 'csep', '/'));
    const b = el('button', 'crumb' + (i === parts.length - 1 ? ' last' : ''), p);
    b.onclick = () => load(parts.slice(0, i + 1).join('/'));
    c.appendChild(b);
  });
  requestAnimationFrame(() => { c.scrollLeft = c.scrollWidth; });
}

function iconFor(e) {
  if (e.type === 'dir') return ICONS.folder;
  const ext = extOf(e.name);
  if (IMAGE_EXT.has(ext)) return ICONS.image;
  if (['.zip', '.tar', '.gz', '.tgz', '.bz2', '.xz', '.7z', '.rar'].includes(ext)) return ICONS.archive;
  if (['.js','.jsx','.ts','.tsx','.mjs','.cjs','.py','.rb','.go','.rs','.c','.h','.cpp','.hpp','.java','.kt','.sh','.bash','.zsh','.php','.lua','.swift','.cs','.vue','.svelte','.css','.scss','.html','.htm','.xml','.json','.yml','.yaml','.toml','.sql'].includes(ext)) return ICONS.code;
  if (e.type === 'link') return ICONS.link;
  return ICONS.file;
}

function visibleEntries() {
  const q = state.filter.trim().toLowerCase();
  let list = state.entries.filter(e => (state.hidden || !e.name.startsWith('.')) &&
    (!q || e.name.toLowerCase().includes(q)));
  const dir = state.sort.dir;
  const key = state.sort.key;
  list.sort((a, b) => {
    const ad = a.type === 'dir' ? 0 : 1, bd = b.type === 'dir' ? 0 : 1;
    if (ad !== bd) return ad - bd;
    let r = 0;
    if (key === 'size') r = (a.size || 0) - (b.size || 0);
    else if (key === 'mtime') r = (a.mtime || 0) - (b.mtime || 0);
    else r = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    return r * dir;
  });
  return list;
}

function render() {
  const rows = $('#rows');
  rows.innerHTML = '';
  const list = visibleEntries();
  $('#count').textContent = list.length + (list.length === 1 ? ' item' : ' items') +
    (state.filter ? ' (filtered)' : '');
  const frag = document.createDocumentFragment();
  list.forEach(e => {
    const row = el('div', 'row' + (e.type === 'dir' ? ' dir' : '') + (state.selected.has(e.name) ? ' sel' : ''));
    row.tabIndex = 0;
    row.dataset.name = e.name;
    const c1 = el('div', 'c-check');
    const pick = el('input', 'pick');
    pick.type = 'checkbox';
    pick.checked = state.selected.has(e.name);
    pick.onclick = ev => { ev.stopPropagation(); toggleSel(e.name, pick.checked); };
    c1.appendChild(pick);
    const c2 = el('div', 'c-name');
    const ic = el('span', 'ic'); ic.innerHTML = iconFor(e);
    c2.append(ic, el('span', 'nm', e.name));
    if (e.link) c2.appendChild(el('span', 'badge', e.external ? 'external link' : 'link'));
    c2.onclick = () => openEntry(e);
    const c3 = el('div', 'c-size', e.type === 'dir' ? '—' : fmtSize(e.size));
    const c4 = el('div', 'c-time', fmtDate(e.mtime));
    const c5 = el('div', 'c-act');
    const mk = (act, title, icon, fn, cls = '') => {
      const b = el('button', 'act' + cls, '');
      b.type = 'button'; b.title = title; b.setAttribute('aria-label', title);
      b.innerHTML = icon;
      b.onclick = ev => { ev.stopPropagation(); fn(e); };
      return b;
    };
    if (e.type === 'dir') c5.appendChild(mk('download', 'Download folder (.tar.gz)', ICONS.download, dlEntry));
    else c5.appendChild(mk('download', 'Download', ICONS.download, dlEntry));
    c5.appendChild(mk('rename', 'Rename / move', ICONS.edit, promptRename));
    c5.appendChild(mk('delete', 'Delete', ICONS.trash, delEntry, ' del'));
    row.append(c1, c2, c3, c4, c5);
    row.onclick = ev => {
      if (ev.target.closest('.act') || ev.target.closest('.pick')) return;
      openEntry(e);
    };
    row.onkeydown = ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); openEntry(e); }
      if (ev.key === ' ' && ev.target === row) { ev.preventDefault(); toggleSel(e.name, !state.selected.has(e.name)); }
    };
    frag.appendChild(row);
  });
  rows.appendChild(frag);
  $('#none').hidden = list.length > 0;
  if (!list.length) {
    $('#none').innerHTML = ICONS.empty;
    $('#none').appendChild(el('b', '', state.filter ? 'Nothing matches the filter' : 'This folder is empty'));
    $('#none').appendChild(el('span', '', state.filter ? 'Clear the search to see everything.' : 'Drop files here or use Upload.'));
  }
  $('#selAll').checked = list.length > 0 && list.every(e => state.selected.has(e.name));
  $('#selbar').classList.toggle('hide', state.selected.size === 0);
  $('#stat').textContent = list.length + ' items' + (state.selected.size ? ' · ' + state.selected.size + ' selected' : '');
  document.querySelectorAll('#thead [data-sort]').forEach(h => {
    h.classList.toggle('sorted', h.dataset.sort === state.sort.key);
    h.querySelector('.arrow')?.remove();
    if (h.dataset.sort === state.sort.key) h.appendChild(el('span', 'arrow', state.sort.dir > 0 ? '▲' : '▼'));
  });
  syncSortChk();
}

function syncSortChk() {
  document.querySelectorAll('[data-sort-chk]').forEach(s => {
    s.textContent = s.dataset.sortChk === state.sort.key ? (state.sort.dir > 0 ? '▲' : '▼') : '';
  });
}

function pickSort(key) {
  if (state.sort.key === key) state.sort.dir *= -1;
  else { state.sort.key = key; state.sort.dir = 1; }
  store.set('files.sort', state.sort.key);
  store.set('files.dir', String(state.sort.dir));
  render();
  closeMenu();
}

function toggleSel(name, on) {
  if (on) state.selected.add(name); else state.selected.delete(name);
  const row = [...document.querySelectorAll('.row')].find(r => r.dataset.name === name);
  if (row) { row.classList.toggle('sel', on); row.querySelector('.pick').checked = on; }
  const list = visibleEntries();
  $('#selAll').checked = list.length > 0 && list.every(e => state.selected.has(e.name));
  $('#selbar').classList.toggle('hide', state.selected.size === 0);
  $('#stat').textContent = list.length + ' items' + (state.selected.size ? ' · ' + state.selected.size + ' selected' : '');
}

/* ---------------------------------------------------------------- data */
async function load(path, opts = {}) {
  try {
    const data = await api('/api/list?path=' + enc(path));
    state.cwd = data.path;
    state.entries = data.entries;
    state.selected.clear();
    store.set('files.cwd', state.cwd);
    crumbs();
    render();
  } catch (e) {
    if (opts.fallback && path) { toast('Could not open the saved folder: ' + e.message, 'err'); return load('', { fallback: false }); }
    toast(e.message, 'err');
  }
}

function openEntry(e) {
  if (e.type === 'dir') return load(joinPath(state.cwd, e.name));
  if (e.external) return toast('This link points outside the workspace.', 'err');
  if (IMAGE_EXT.has(extOf(e.name))) return preview(e);
  if (isText(e.name)) return editor(e);
  dlEntry(e);
}

function dlEntry(e) {
  if (e.external) return toast('This link points outside the workspace.', 'err');
  const p = joinPath(state.cwd, e.name);
  const a = document.createElement('a');
  a.href = BASE + '/api/download?path=' + enc(p);
  a.download = e.name;
  document.body.appendChild(a); a.click(); a.remove();
}

async function delEntry(e) {
  return deletePaths([e.name], [e.name]);
}

async function deletePaths(names, display) {
  const ok = await confirmDialog('Delete ' + (names.length === 1 ? 'this item?' : `${names.length} items?`),
    'This cannot be undone.', display);
  if (!ok) return;
  try {
    const r = await api('/api/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: names.map(n => joinPath(state.cwd, n)) }),
    });
    if (r.errors && r.errors.length) toast(r.errors[0].error, 'err');
    else toast(`Deleted ${r.deleted.length} item${r.deleted.length === 1 ? '' : 's'}`, 'ok');
    await load(state.cwd);
  } catch (e) { toast(e.message, 'err'); }
}

async function promptRename(e) {
  const from = joinPath(state.cwd, e.name);
  const to = await promptDialog('Rename or move', 'Path relative to workspaces. Change the folder part to move it.', from);
  if (!to || to === from) return;
  try {
    await api('/api/rename', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: from, to }),
    });
    toast('Renamed', 'ok');
    await load(state.cwd);
  } catch (err) { toast(err.message, 'err'); }
}

/* ---------------------------------------------------------------- editor */
let editorOriginal = '';
function editor(e) {
  const p = joinPath(state.cwd, e.name);
  api('/api/read?path=' + enc(p)).then(data => {
    state.editor = { path: p, name: e.name };
    editorOriginal = data.content;
    $('#eName').textContent = e.name;
    $('#eMeta').textContent = fmtSize(data.size);
    const t = $('#eText');
    t.value = data.content;
    $('#editor').hidden = false;
    $('#editor').classList.remove('dirty');
    setTimeout(() => t.focus(), 30);
    t.oninput = () => $('#editor').classList.toggle('dirty', t.value !== editorOriginal);
    t.onkeydown = ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); saveEditor(); } };
  }).catch(err => toast(err.message, 'err'));
}
async function saveEditor() {
  if (!state.editor) return;
  const t = $('#eText');
  try {
    await api('/api/write?path=' + enc(state.editor.path), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: t.value }),
    });
    editorOriginal = t.value;
    $('#editor').classList.remove('dirty');
    toast('Saved', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
async function closeEditor() {
  if ($('#editor').classList.contains('dirty')) {
    const ok = await dialog({ title: 'Discard changes?', body: 'You have unsaved edits in this file.', ok: 'Discard', danger: true });
    if (!ok) return;
  }
  $('#editor').hidden = true;
  state.editor = null;
  $('#eText').value = '';
}

/* ---------------------------------------------------------------- preview */
function preview(e) {
  const p = joinPath(state.cwd, e.name);
  $('#pName').textContent = e.name;
  $('#pImg').src = BASE + '/api/raw?path=' + enc(p);
  $('#pImg').alt = e.name;
  $('#preview').hidden = false;
  $('#pDownload').onclick = () => dlEntry(e);
}

/* ---------------------------------------------------------------- uploads */
function addUpload(name) {
  const row = el('div', 'up');
  const n = el('span', 'n', name);
  const p = el('span', 'p', '0%');
  const bar = el('span', 'bar'); const i = el('i');
  bar.appendChild(i);
  row.append(n, p, bar);
  $('#upList').appendChild(row);
  $('#ups').hidden = false;
  return { row, p, i, name };
}
function uploadOne(file, dir) {
  return new Promise(resolve => {
    const ui = addUpload(file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${BASE}/api/upload?path=${enc(dir)}&name=${enc(file.name)}`);
    xhr.setRequestHeader('X-Files', '1');
    xhr.upload.onprogress = ev => {
      if (!ev.lengthComputable) return;
      const pct = Math.round(ev.loaded / ev.total * 100);
      ui.i.style.width = pct + '%';
      ui.p.textContent = pct + '%';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        ui.i.style.width = '100%';
        ui.p.textContent = 'done';
        ui.row.classList.add('done');
        let name = file.name;
        try { name = JSON.parse(xhr.responseText).name || name; } catch {}
        resolve({ ok: true, name });
      } else {
        let msg = 'HTTP ' + xhr.status;
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        ui.p.textContent = msg;
        ui.row.classList.add('err');
        resolve({ ok: false, name: file.name, error: msg });
      }
    };
    xhr.onerror = () => {
      ui.p.textContent = 'network error';
      ui.row.classList.add('err');
      resolve({ ok: false, name: file.name, error: 'network error' });
    };
    xhr.send(file);
  });
}
async function uploadFiles(files) {
  if (!files || !files.length) return;
  const dir = state.cwd;
  setConn('busy');
  $('#ups').hidden = false;
  $('#upSum').textContent = files.length + ' file' + (files.length === 1 ? '' : 's');
  let ok = 0, fail = 0;
  for (const f of files) {
    const r = await uploadOne(f, dir);
    if (r.ok) ok++; else { fail++; toast(`${r.name}: ${r.error}`, 'err'); }
  }
  $('#upSum').textContent = `${ok} done` + (fail ? `, ${fail} failed` : '');
  setConn(ok ? 'ok' : 'bad');
  await load(dir);
  setTimeout(() => { if (!$('#ups').hidden) { $('#ups').hidden = true; $('#upList').innerHTML = ''; } }, 4500);
}

/* ---------------------------------------------------------------- menu + buttons */
function initIcons() {
  $('#bUpload').innerHTML = ICONS.upload;
  $('#bMkdir').innerHTML = ICONS.mkdir;
  $('#bRefresh').innerHTML = ICONS.refresh;
  $('#bMenu').innerHTML = ICONS.dots;
  $('#mDownload').innerHTML = ICONS.download + '<span>Download this folder</span>';
  $('#mSelectAll').innerHTML = ICONS.selectAll + '<span>Select all</span>';
  $('#mTerminal').innerHTML = ICONS.terminal + '<span>Open terminal</span>';
}

$('#bUpload').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { uploadFiles([...e.target.files]); e.target.value = ''; };
$('#bRefresh').onclick = () => load(state.cwd);
$('#bMkdir').onclick = async () => {
  const name = await promptDialog('New folder', 'Name for the new folder.', '', 'Create');
  if (!name) return;
  try {
    await api('/api/mkdir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: joinPath(state.cwd, name) }),
    });
    toast('Folder created', 'ok');
    await load(state.cwd);
  } catch (e) { toast(e.message, 'err'); }
};
function closeMenu() {
  $('#menu').hidden = true;
  $('#bMenu').classList.remove('on');
  $('#bMenu').setAttribute('aria-expanded', 'false');
}
$('#bMenu').onclick = () => {
  const m = $('#menu');
  m.hidden = !m.hidden;
  $('#bMenu').classList.toggle('on', !m.hidden);
  $('#bMenu').setAttribute('aria-expanded', String(!m.hidden));
  if (!m.hidden) { $('#chkHidden').textContent = state.hidden ? '✓' : ''; syncSortChk(); }
};
document.addEventListener('click', e => {
  if (!$('#menu').hidden && !e.target.closest('#menu') && !e.target.closest('#bMenu')) closeMenu();
});
$('#mDownload').onclick = () => {
  const a = document.createElement('a');
  a.href = BASE + '/api/archive?path=' + enc(state.cwd);
  document.body.appendChild(a); a.click(); a.remove();
  closeMenu();
};
$('#mHidden').onclick = () => {
  state.hidden = !state.hidden;
  store.set('files.hidden', state.hidden ? '1' : '0');
  $('#chkHidden').textContent = state.hidden ? '✓' : '';
  render();
};
$('#mSelectAll').onclick = () => {
  visibleEntries().forEach(e => state.selected.add(e.name));
  render();
  closeMenu();
};
$('#mSortName').onclick = () => pickSort('name');
$('#mSortSize').onclick = () => pickSort('size');
$('#mSortTime').onclick = () => pickSort('mtime');
$('#mTerminal').onclick = () => { location.href = '/'; };

$('#bClearSel').onclick = () => { state.selected.clear(); render(); };
$('#bDelSel').onclick = () => deletePaths([...state.selected], [...state.selected]);
$('#selAll').onchange = e => {
  if (e.target.checked) visibleEntries().forEach(x => state.selected.add(x.name));
  else state.selected.clear();
  render();
};
document.querySelectorAll('#thead [data-sort]').forEach(h => { h.onclick = () => pickSort(h.dataset.sort); });
$('#q').oninput = e => { state.filter = e.target.value; render(); };

/* editor / preview buttons */
$('#eSave').onclick = saveEditor;
$('#eClose').onclick = closeEditor;
$('#eDownload').onclick = () => {
  if (!state.editor) return;
  const a = document.createElement('a');
  a.href = BASE + '/api/download?path=' + enc(state.editor.path);
  a.download = state.editor.name;
  document.body.appendChild(a); a.click(); a.remove();
};
$('#pClose').onclick = () => { $('#preview').hidden = true; $('#pImg').removeAttribute('src'); };
$('#preview').onclick = e => { if (e.target.id === 'preview') $('#pClose').click(); };

/* drag & drop */
let dragDepth = 0;
const stage = $('#stage');
stage.addEventListener('dragenter', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); dragDepth++;
  const d = $('#drop');
  d.hidden = false;
  d.innerHTML = ICONS.upload + '<span>Drop files to upload to <b>/' + (state.cwd ? state.cwd.replace(/&/g, '&amp;').replace(/</g, '&lt;') : 'workspaces') + '</b></span><small>They keep their names; duplicates get a numeric suffix.</small>';
});
stage.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
stage.addEventListener('dragleave', e => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('drop', e => {
  if (!e.dataTransfer) return;
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  uploadFiles([...e.dataTransfer.files]);
});

/* keyboard */
document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) closeMenu();
    else if (!$('#preview').hidden) $('#pClose').click();
    else if (!$('#modal').hidden) document.querySelector('.dialog .btn')?.click();
    else if (!$('#editor').hidden) closeEditor();
    return;
  }
  if (typing) return;
  if (e.key === '/' ) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Delete' && state.selected.size) { e.preventDefault(); $('#bDelSel').click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && $('#editor').hidden) {
    e.preventDefault();
    visibleEntries().forEach(x => state.selected.add(x.name));
    render();
  }
});
window.addEventListener('beforeunload', e => {
  if (state.editor && $('#editor').classList.contains('dirty')) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------------------------------------------------------------- boot */
initIcons();
setConn('busy');
ping();
const saved = store.get('files.cwd');
load(saved !== null && saved !== '' ? saved : '', { fallback: true });
})();
</script>
</body>
</html>
