<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23000000'/%3E%3Cpath d='M18 24l9 8-9 8' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M33 40h13' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>/*XTERM_CSS*/</style>
<style>
@font-face{font-family:"VazirTerm";font-weight:400;font-display:block;
  src:url(data:font/woff2;base64,/*FONT_REGULAR*/) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"VazirTerm";font-weight:700;font-display:block;
  src:url(data:font/woff2;base64,/*FONT_BOLD*/) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}

/* ---------------------------------------------------------------- tokens */
:root{
  --bg:#000; --bar:#000; --panel:#000; --raise:#000;
  --line:rgba(255,255,255,.18); --line2:rgba(255,255,255,.34);
  --txt:#fff; --muted:rgba(255,255,255,.65); --dim:rgba(255,255,255,.42);
  --accent:#fff; --ok:#2fd27f; --warn:#f5b942; --bad:#ff5c5c;
  --top:46px; --r:2px; --term:#000;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit}
::selection{background:rgba(255,255,255,.25)}
#top,#top *,#menu,#menu *,#empty,#empty *,#keys,#keys *,#toast,#stage,.twrap{box-sizing:border-box}

/* ---------------------------------------------------------------- top bar */
#top{position:relative;z-index:30;display:flex;align-items:center;gap:9px;
  height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  padding-left:9px;padding-right:9px;background:var(--bar);
  border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;
  color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.1px}
.brand svg{display:block;width:19px;height:19px;color:rgba(255,255,255,.5)}
.brand .ac{stroke:var(--accent)}
.brand .divider{width:1px;height:18px;margin-left:9px;background:var(--line2)}

#tabs{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:5px;height:100%;
  padding:0 1px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;
  max-width:200px;height:30px;padding:0 5px 0 10px;border:1px solid transparent;
  border-radius:2px;color:var(--muted);cursor:pointer;
  transition:background .13s,color .13s,border-color .13s}
.tab:hover{background:#ffffff07;color:var(--txt)}
.tab.active{background:#000;border-color:#fff;color:#fff}
.tab.insplit{border-color:rgba(255,255,255,.55);background:transparent}
.tab .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .dot{flex:0 0 auto;width:6px;height:6px;border-radius:1px;background:var(--dim);
  transition:background .2s,box-shadow .2s}
.tab[data-st="on"] .dot{background:var(--ok);box-shadow:0 0 7px rgba(47,210,127,.6)}
.tab[data-st="wait"] .dot{background:var(--warn);animation:pulse 1.15s infinite}
.tab[data-st="off"] .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.tab .x{flex:0 0 auto;display:grid;place-items:center;width:18px;height:18px;padding:0;
  border:0;border-radius:2px;background:none;color:inherit;opacity:0;cursor:pointer;
  transition:opacity .12s,background .12s}
.tab:hover .x,.tab.active .x,.tab.insplit .x{opacity:.75}
.tab .x:hover{background:#ffffff14;opacity:1}
.tab .x svg{width:11px;height:11px}

.actions{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.ib{display:grid;place-items:center;width:31px;height:31px;padding:0;border:1px solid transparent;
  border-radius:2px;background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;
  transition:background .13s,color .13s,border-color .13s}
.ib:hover{background:#ffffff0b;color:var(--txt)}
.ib:active{background:#ffffff12}
.ib.on{background:#fff;border-color:#fff;color:#000}
.ib:disabled{opacity:.3;cursor:default;background:none;color:var(--muted);border-color:transparent}
.ib svg{width:17px;height:17px}
.ib:focus-visible,.tab:focus-visible,.mi:focus-visible,.kb:focus-visible,
.primary:focus-visible,.fsrow button:focus-visible{
  outline:2px solid #fff;outline-offset:1px}

/* ---------------------------------------------------------------- menu */
#menu{position:absolute;top:calc(var(--top) + env(safe-area-inset-top) + 5px);right:9px;z-index:50;width:250px;padding:6px;
  border-radius:2px;background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 18px 40px #000b,0 2px 10px #0008}
#menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 9px;border:0;
  border-radius:2px;background:none;color:var(--txt);font-size:12.5px;text-align:left;cursor:pointer}
.mi:hover{background:#ffffff0a}
.mi:disabled{opacity:.35;cursor:default;background:none}
.mi svg{flex:0 0 auto;width:15px;height:15px;color:var(--dim)}
.sep{height:1px;margin:5px 6px;background:var(--line)}
.fsrow{display:flex;align-items:center;gap:8px;height:38px;padding:0 9px;
  font-size:12.5px;color:var(--muted)}
.sp{flex:1 1 auto}
.fsrow b{min-width:24px;text-align:center;font-weight:600;color:var(--txt);
  font-variant-numeric:tabular-nums}
.fsrow button{display:grid;place-items:center;width:26px;height:26px;padding:0;
  border:1px solid var(--line2);border-radius:2px;background:var(--raise);
  color:var(--txt);font-size:15px;line-height:1;cursor:pointer}
.fsrow button:hover{background:#fff;color:#000}

/* ---------------------------------------------------------------- stage */
#stage{position:relative;flex:1 1 auto;min-height:0;display:grid;gap:8px;padding:8px;
  grid-template-columns:minmax(0,1fr);background:var(--bg)}
#stage.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.twrap{position:relative;grid-row:1;min-width:0;min-height:0;display:none;
  padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--term);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.twrap.show{display:block}
.twrap.pa{grid-column:1}
#stage.split .twrap.focus{border-color:#fff}
#stage.split .twrap.pa{border-color:rgba(255,255,255,.34)}
.twrap.pb{grid-column:2}
#stage.split .twrap.pb{border-color:rgba(255,255,255,.34)}

/* empty state */
#empty{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;
  gap:4px;padding:24px;text-align:center}
#empty[hidden]{display:none}
.elogo{display:grid;place-items:center;width:54px;height:54px;border-radius:2px;
  background:#000;border:1px solid rgba(255,255,255,.5)}
.elogo svg{width:27px;height:27px;color:rgba(255,255,255,.55)}
.elogo .ac{stroke:var(--accent)}
#empty h1{margin:12px 0 0;font-size:15px;font-weight:600;color:var(--txt)}
#empty p{margin:5px 0 0;max-width:360px;font-size:12.5px;line-height:1.8;color:var(--muted)}
.primary{margin-top:14px;height:36px;padding:0 18px;border-radius:2px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:#000;background:#fff;
  border:1px solid #fff;transition:background .13s,border-color .13s}
.primary:hover{background:#e4e4e4;border-color:#e4e4e4}

/* small notify pill */
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,8px);z-index:80;
  max-width:80vw;padding:8px 14px;border-radius:2px;background:#000;
  border:1px solid var(--line2);color:var(--txt);font-size:12px;opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;backdrop-filter:blur(6px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* touch keyboard helpers */
#keys{display:none;align-items:center;gap:6px;padding:0 8px;background:var(--bar);
  border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  height:calc(46px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#keys::-webkit-scrollbar{display:none}
.kb{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;gap:6px;
  min-width:38px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:2px;
  background:var(--raise);color:var(--txt);font-size:12px;cursor:pointer}
.kb:active{background:#fff;color:#000}
.kb svg{width:14px;height:14px}
@media (hover:none) and (pointer:coarse){#keys{display:flex}}

/* ---------------------------------------------------------------- xterm */
.xterm .xterm-viewport::-webkit-scrollbar{width:10px}
.xterm .xterm-viewport::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px;
  border:3px solid var(--term)}
.xterm .xterm-viewport::-webkit-scrollbar-track{background:transparent}

/* Persian phrases are shaped/ordered by the browser's own text engine */
.xterm-rows span.rtl{display:inline-block;white-space:pre;direction:rtl;unicode-bidi:isolate;
  letter-spacing:0!important;overflow:hidden;vertical-align:top;text-align:right}
.xterm-rows span.rtl>span.rtl-in{display:inline-block;white-space:pre;transform-origin:100% 50%}

/* ---------------------------------------------------------------- narrow */
@media (max-width:760px){
  #stage.split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  #stage.split .twrap.pa{grid-column:1;grid-row:1}
  #stage.split .twrap.pb{grid-column:1;grid-row:2;border-color:var(--line2)}
  .brand .name{display:none}
  .brand .divider{display:none}
  #top{gap:5px;padding:0 6px}
  .tab{max-width:150px}
  #menu{width:min(250px,calc(100vw - 16px))}
}
@media (hover:none){.tab .x{opacity:.75}}
</style>
</head>

  </header>

  <main id="stage">

</div>

<script>
(() => {
"use strict";

/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const rAF = fn => requestAnimationFrame(fn);
const enc = new TextEncoder(), dec = new TextDecoder();
const FONT_STACK = '"VazirTerm","Cascadia Mono","Cascadia Code",Consolas,' +
  '"DejaVu Sans Mono","Liberation Mono",Menlo,monospace';
const CLOSE_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.6" stroke-linecap="round"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>';
const THEME = {
  background: "#000", foreground: "#e8e8e8",
  cursor: "#fff", cursorAccent: "#000",
  selectionBackground: "rgba(255,255,255,0.22)",
  black: "#3b4252", red: "#e06c75", green: "#98c379", yellow: "#e5c07b",
  blue: "#61afef", magenta: "#c678dd", cyan: "#56b6c2", white: "#abb2bf",
  brightBlack: "#5c6370", brightRed: "#ff7b86", brightGreen: "#b5e890",
  brightYellow: "#ffd68a", brightBlue: "#7cc0ff", brightMagenta: "#e09bf0",
  brightCyan: "#70d0dc", brightWhite: "#e6edf7",
};

const UI_KEY = "term.ui.v2";                     // v2: multi-terminal layout state
const ST_TXT = { on: "Connected", wait: "Connecting", off: "Disconnected — retrying" };

let SLOTS = 6;                                   // updated from /info at boot
let font = Math.min(34, Math.max(9, parseInt(store.get("fs"), 10) || 15));
const terms = new Map();                         // slot -> record
let paneA = 0, paneB = 0, active = 0;            // paneB = 0 -> single view
let touched = [];                                // most recently focused slots first

/* --------------------------------------------- RTL shaping (per terminal) */
const RTL_CH = /[\u0590-\u08FF\u200F\uFB1D-\uFDFF\uFE70-\uFEFF]/;
const EXT_CH = /[A-Za-z0-9_@#%&*+=\/.,:;!?()\[\]"'\-\u200C\u200D\u00C0-\u024F]/;
const WIDE = /[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE6F\uFF00-\uFF60\u{1F300}-\u{1FAFF}]/u;
const ZERO = /[\u200B-\u200F\u0300-\u036F\p{Mn}\p{Me}\p{Cf}]/u;
const natCache = new Map();

function cellsOf(s) {
  let n = 0;
  for (const ch of s) n += WIDE.test(ch) ? 2 : (ZERO.test(ch) ? 0 : 1);
  return n;
}

/* Keep the terminal's own left-to-right cell geometry while letting the browser
   shape/order embedded Persian phrases. Runs per terminal because every terminal
   owns its rows, its cell width and its render cycle. */
function installRTL(term) {
  const rows = term.element.querySelector(".xterm-rows");
  let cellW = 0, cellCols = -1, cellFs = -1, busy = false, queued = false;

  /* Tell xterm which cell ranges form one Persian/Arabic phrase: the DOM renderer then emits a
     single span for the whole phrase instead of one span per character (which would break the
     joining/shaping and read right-to-left letter by letter). Latin/prompt text stays untouched. */
  const jid = term.registerCharacterJoiner(text => {
    const out = [], n = text.length;
    let i = 0;
    while (i < n) {
      if (!RTL_CH.test(text[i])) { i++; continue; }
      let end = i + 1, j = i + 1, sp = 0;
      for (; j < n; j++) {
        const c = text[j];
        if (c === " ") { sp++; if (sp >= 3) break; continue; }
        sp = 0;
        if (RTL_CH.test(c)) end = j + 1;
        else if (!EXT_CH.test(c)) break;
      }
      out.push([i, end]);
      i = Math.max(end, i + 1);
    }
    const merged = [];
    for (const r of out) {
      const l = merged[merged.length - 1];
      if (l && r[0] < l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r);
    }
    return merged;
  });

  function measure() {
    if (cellW > 0 && cellCols === term.cols && cellFs === term.options.fontSize) return;
    const w = rows ? rows.getBoundingClientRect().width : 0;
    if (w > 0 && term.cols > 0) {
      cellW = w / term.cols; cellCols = term.cols; cellFs = term.options.fontSize;
    }
  }

  function fixSpan(sp) {
    const text = sp.textContent;
    const w = cellsOf(text) * cellW;
    sp.classList.add("rtl");
    sp.style.width = w + "px";
    const inner = document.createElement("span");
    inner.className = "rtl-in"; inner.textContent = text;
    sp.textContent = ""; sp.appendChild(inner);
    const key = (term.options.fontSize || 15) + (sp.classList.contains("xterm-bold") ? "|B|" : "||") + text;
    let nat = natCache.get(key);
    if (nat === undefined) {
      nat = inner.getBoundingClientRect().width;
      if (natCache.size > 800) natCache.clear();
      if (nat > 0) natCache.set(key, nat);
    }
    if (nat > 0) inner.style.transform = "scaleX(" + Math.max(0.6, Math.min(1.6, w / nat)).toFixed(3) + ")";
  }

  function fixSpans() {
    if (busy || !rows) return;
    measure();
    if (!cellW) {
      if (!queued) { queued = true; rAF(() => { queued = false; fixSpans(); }); }
      return;
    }
    busy = true;
    try {
      for (const row of rows.children)
        for (const sp of row.children)
          if (!sp.classList.contains("rtl") && !sp.classList.contains("rtl-in") &&
              RTL_CH.test(sp.textContent)) fixSpan(sp);
    } finally { busy = false; obs.takeRecords(); }
  }

  const obs = new MutationObserver(recs => {
    for (const r of recs) {
      const n = r.target.nodeType === 1 ? r.target : r.target.parentElement;
      if (!n || !n.closest(".rtl,.rtl-in")) { fixSpans(); return; }
    }
    obs.takeRecords();
  });
  if (rows) obs.observe(rows, { childList: true, subtree: true, characterData: true });

  return {
    fix: fixSpans,
    kill() {
      obs.disconnect();
      try { term.deregisterCharacterJoiner(jid); } catch (e) {}
    },
  };
}

/* ------------------------------------------------------------- terminal */
const ro = new ResizeObserver(es => {
  for (const e of es) {
    const slot = +e.target.dataset.slot;
    if (e.contentRect.width > 0 && e.contentRect.height > 0) scheduleFit(slot);
  }
});
let fitQueue = new Set(), fitRaf = 0;

function scheduleFit(slot) {
  fitQueue.add(slot);
  if (!fitRaf) fitRaf = rAF(() => {
    const q = [...fitQueue]; fitQueue.clear(); fitRaf = 0;
    for (const s of q) fitSlot(s);
  });
}

function fitSlot(slot) {
  const t = slot ? terms.get(slot) : null;
  if (!t || t.closed || !t.wrap.classList.contains("show")) return;
  if (!t.wrap.clientWidth || !t.wrap.clientHeight) return;
  try { t.fit.fit(); } catch (e) {}
  rAF(() => {
    if (t.closed || !t.wrap.classList.contains("show")) return;
    try { t.term.refresh(0, Math.max(0, t.term.rows - 1)); } catch (e) {}
    if (t.rtl) t.rtl.fix();
  });
}

function firstFree() {
  for (let i = 1; i <= SLOTS; i++) if (!terms.has(i)) return i;
  return 0;
}
function tabLabel(t) { return "Terminal " + t.slot; }
function setState(t, st) {
  t.st = st;
  if (!t.tab) return;
  t.tab.dataset.st = st;
  const tip = tabLabel(t) + " · " + ST_TXT[st] + (t.title ? " · " + t.title : "");
  t.tab.title = tip;
  t.tab.setAttribute("aria-label", tip);
}

/* ------------------------------------------------------------- websocket */
function tf(url) {
  const opt = { cache: "no-store" };
  try { if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) opt.signal = AbortSignal.timeout(8000); } catch (e) {}
  return fetch(url, opt);
}

function connect(t) {
  if (t.closed) return;
  if (t.ws) { try { t.ws.close(); } catch (e) {} t.ws = null; }
  setState(t, "wait");
  (async () => {
    let token = "";
    try { token = (await (await tf("/t" + t.slot + "/token")).json()).token || ""; } catch (e) {}
    if (!t.closed) openWS(t, token);
  })();
}

function openWS(t, token) {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  let ws;
  try { ws = new WebSocket(proto + location.host + "/t" + t.slot + "/ws", ["tty"]); }
  catch (e) { retryLater(t); return; }
  t.ws = ws;
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    if (t.closed) { try { ws.close(); } catch (e) {} return; }
    t.tries = 0;
    setState(t, "on");
    ws.send(enc.encode(JSON.stringify({
      AuthToken: token, columns: t.term.cols, rows: t.term.rows,
    })));
  };
  ws.onmessage = ev => {
    if (t.ws !== ws) return;
    const d = new Uint8Array(ev.data), cmd = String.fromCharCode(d[0]), body = d.subarray(1);
    if (cmd === "0") t.term.write(body);
    else if (cmd === "1") { t.title = dec.decode(body); setState(t, t.st); }
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onclose = () => {
    if (t.ws !== ws) return;
    t.ws = null;
    if (t.closed) return;
    t.tries += 1;
    setState(t, t.tries >= 3 ? "off" : "wait");
    retryLater(t);
  };
}

function retryLater(t) {
  const n = Math.max(1, t.tries || 1);
  setTimeout(() => { if (!t.closed) connect(t); }, Math.min(700 * n, 5000));
}

function sendBytes(t, bytes) {
  const ws = t.ws;
  if (!ws || ws.readyState !== 1) return;
  const m = new Uint8Array(bytes.length + 1);
  m[0] = 0x30; m.set(bytes, 1);
  ws.send(m);
}
function sendStr(t, s) { sendBytes(t, enc.encode(s)); }

/* ------------------------------------------------------------- lifecycle */
function openSlot(slot) {
  if (terms.has(slot)) { focusSlot(slot); return; }
  const t = {
    slot, ws: null, tries: 0, closed: false, st: "", title: "",
    rtl: null, tab: null, wrap: null,
  };

  t.term = new Terminal({
    allowProposedApi: true, cursorBlink: true, scrollback: 50000,
    fontSize: font, fontFamily: FONT_STACK, theme: THEME,
    macOptionIsMeta: true, drawBoldTextInBrightColors: true, scrollOnUserInput: true,
  });
  t.fit = new FitAddon.FitAddon();
  t.term.loadAddon(t.fit);

  t.wrap = document.createElement("div");
  t.wrap.className = "twrap";
  t.wrap.dir = "ltr";
  t.wrap.dataset.slot = String(slot);
  $("#stage").insertBefore(t.wrap, $("#empty"));
  t.term.open(t.wrap);
  t.rtl = installRTL(t.term);

  t.tab = document.createElement("div");
  t.tab.className = "tab";
  t.tab.role = "tab";
  t.tab.tabIndex = 0;
  t.tab.dataset.slot = String(slot);
  t.tab.innerHTML = '<span class="dot"></span><span class="lbl"></span>' +
    '<button class="x" tabindex="-1" aria-label="Close terminal">' + CLOSE_SVG + "</button>";
  t.tab.querySelector(".lbl").textContent = tabLabel(t);
  t.tab.querySelector(".x").addEventListener("click", ev => {
    ev.stopPropagation(); ev.preventDefault(); closeSlot(slot);
  });
  t.tab.addEventListener("click", () => focusSlot(slot));
  t.tab.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); focusSlot(slot); }
  });
  t.tab.addEventListener("auxclick", ev => {
    if (ev.button === 1) { ev.preventDefault(); closeSlot(slot); }
  });
  $("#tabs").appendChild(t.tab);

  terms.set(slot, t);
  ro.observe(t.wrap);
  wireTerm(t);
  setState(t, "wait");

  if (!paneB) paneA = slot;
  else if (active === paneB) paneB = slot;
  else paneA = slot;
  active = slot;
  noteTouched(slot);

  connect(t);
  layout();
  scrollTab(t.tab);
  focusTerm(slot);
}

function scrollTab(tab) {
  try { tab.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
}

function focusTerm(slot) {
  const t = slot ? terms.get(slot) : null;
  if (!t || t.closed) return;
  try { t.term.focus(); } catch (e) {}
}

function noteTouched(slot) {
  touched = [slot, ...touched.filter(s => s !== slot)].slice(0, 12);
}

function focusSlot(slot, grab = true) {
  if (!terms.has(slot)) return;
  if (!paneB) paneA = slot;
  else if (slot !== paneA && slot !== paneB) {
    if (active === paneB) paneB = slot; else paneA = slot;
  }
  active = slot;
  noteTouched(slot);
  layout();
  if (grab) focusTerm(slot);
}

function normalize() {
  if (paneB && (!terms.has(paneB) || paneB === paneA)) paneB = 0;
  if (!terms.has(paneA)) paneA = 0;
  if (!paneA) paneA = terms.has(active) ? active : (terms.keys().next().value || 0);
  if (!paneB && active !== paneA) active = paneA;
  if (!active) active = paneA;
  if (paneB && active !== paneA && active !== paneB) active = paneA;
}

function layout() {
  normalize();
  const split = !!(paneA && paneB);
  $("#stage").classList.toggle("split", split);
  for (const t of terms.values()) {
    const a = t.slot === paneA, b = split && t.slot === paneB;
    t.wrap.classList.toggle("show", a || b);
    t.wrap.classList.toggle("pa", a);
    t.wrap.classList.toggle("pb", b);
    t.wrap.classList.toggle("focus", split && t.slot === active);
    t.tab.classList.toggle("active", t.slot === active);
    t.tab.classList.toggle("insplit", b);
    t.tab.setAttribute("aria-selected", t.slot === active ? "true" : "false");
    t.tab.tabIndex = t.slot === active ? 0 : -1;
  }
  $("#empty").hidden = terms.size > 0;
  $("#bNew").disabled = !firstFree();
  $("#bSplit").disabled = !terms.size;
  $("#bSplit").classList.toggle("on", split);
  $("#bSplit").setAttribute("aria-pressed", split ? "true" : "false");
  $("#mCloseOthers").disabled = terms.size < 2;
  document.title = active ? "Terminal " + active : "Terminal";
  persist();
  rAF(() => { fitSlot(paneA); fitSlot(paneB); });
}

function nearestOther(slot) {
  let best = 0, bd = Infinity;
  for (const s of terms.keys()) {
    if (s === slot) continue;
    const d = Math.abs(s - slot);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

function closeSlot(slot) {
  const t = terms.get(slot);
  if (!t) return;
  const next = nearestOther(slot);
  t.closed = true;
  if (t.ws) { try { t.ws.close(); } catch (e) {} t.ws = null; }
  try { t.rtl.kill(); } catch (e) {}
  try { ro.unobserve(t.wrap); } catch (e) {}
  try { t.term.dispose(); } catch (e) {}
  t.wrap.remove();
  t.tab.remove();
  terms.delete(slot);
  touched = touched.filter(s => s !== slot);

  if (paneB === slot) {
    paneB = 0;
    if (active === slot) active = paneA;
  } else if (paneA === slot) {
    if (paneB) { paneA = paneB; active = paneB; paneB = 0; }
    else { paneA = next; active = next; }
  }
  layout();
  if (terms.size) focusTerm(active || paneA);
}

function pickOther(slot) {
  for (const s of touched) if (s !== slot && terms.has(s)) return s;
  for (const s of terms.keys()) if (s !== slot) return s;
  return 0;
}

function toggleSplit() {
  if (paneB) {
    paneB = 0;
    if (active !== paneA) active = paneA;
    layout(); focusTerm(active);
    return;
  }
  if (!paneA) return;
  const other = pickOther(active || paneA);
  if (!other) {
    const free = firstFree();
    if (!free) { toast("All " + SLOTS + " terminals are already open"); return; }
    const keep = active || paneA;
    openSlot(free);
    paneA = keep; paneB = free; active = keep;
    layout(); focusTerm(keep);
    return;
  }
  paneB = other;
  layout();
  focusTerm(active || paneA);
}

function persist() {
  store.set(UI_KEY, JSON.stringify({
    slots: [...terms.keys()], paneA, paneB, active,
  }));
}

/* ------------------------------------------------------------- terminal io */
function wireTerm(t) {
  const term = t.term;
  term.onData(s => sendStr(t, s));
  term.onBinary(s => {
    const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255;
    sendBytes(t, b);
  });
  term.onResize(({ cols, rows }) => {
    const ws = t.ws;
    if (ws && ws.readyState === 1) {
      ws.send(enc.encode("1" + JSON.stringify({ columns: cols, rows })));
    }
  });
  term.attachCustomKeyEventHandler(ev => {
    if (ev.type !== "keydown") return true;
    const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    const mod = ev.ctrlKey || ev.metaKey;
    if (mod && !ev.altKey && k === "v") return false;        // let the browser paste
    if (ev.shiftKey && ev.key === "Insert") return false;
    if (mod && !ev.altKey && k === "c" && (ev.shiftKey || term.hasSelection())) {
      copySel(t); return false;
    }
    return true;
  });
  term.parser.registerOscHandler(52, data => {               // OSC 52 clipboard
    const p = data.split(";"), b64 = p[p.length - 1];
    if (b64 && b64 !== "?") {
      try {
        const bin = atob(b64);
        const text = dec.decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
        navigator.clipboard.writeText(text).catch(() => {});
      } catch (e) {}
    }
    return true;
  });
  t.wrap.addEventListener("mousedown", () => {
    if (active !== t.slot) focusSlot(t.slot, false);
  }, true);
}

async function copySel(t) {
  const text = t.term.getSelection();
  if (!text) { toast("Nothing selected"); return false; }
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  if (!ok) toast("Could not copy — clipboard access is blocked");
  return ok;
}

async function pasteActive() {
  const t = terms.get(active) || terms.get(paneA);
  if (!t) return;
  try {
    const text = await navigator.clipboard.readText();
    if (text) t.term.paste(text);
  } catch (e) {
    toast("Clipboard access is blocked — use Ctrl+V");
  }
  t.term.focus();
}

/* ---------------------------------------------------------------- ui */
let toastTimer = 0;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2400);
}

function openMenu() {
  $("#menu").hidden = false;
  $("#bMore").setAttribute("aria-expanded", "true");
}
function closeMenu() {
  $("#menu").hidden = true;
  $("#bMore").setAttribute("aria-expanded", "false");
}

function setFont(f) {
  font = Math.min(34, Math.max(9, f));
  store.set("fs", font);
  $("#fsVal").textContent = font;
  for (const t of terms.values()) t.term.options.fontSize = font;
  rAF(() => { fitSlot(paneA); fitSlot(paneB); });
}

$("#fsVal").textContent = font;
$("#bNew").addEventListener("click", () => {
  const s = firstFree();
  if (!s) { toast("All " + SLOTS + " terminals are already open"); return; }
  openSlot(s);
});
$("#bEmptyNew").addEventListener("click", () => {
  const s = firstFree() || 1;
  openSlot(s);
});
$("#bSplit").addEventListener("click", toggleSplit);
$("#bMore").addEventListener("click", ev => {
  ev.stopPropagation();
  if ($("#menu").hidden) openMenu(); else closeMenu();
});
$("#mCloseOthers").addEventListener("click", () => {
  closeMenu();
  const keep = active || paneA;
  for (const s of [...terms.keys()]) if (s !== keep) closeSlot(s);
  if (terms.has(keep)) {
    paneA = keep; paneB = 0; active = keep;
    layout(); focusTerm(keep);
  }
});
$("#mReconnect").addEventListener("click", () => {
  closeMenu();
  for (const t of terms.values()) { t.tries = 0; connect(t); }
  toast("Reconnecting…");
  focusTerm(active);
});
$("#mPaste").addEventListener("click", () => { closeMenu(); pasteActive(); });
$("#mCopy").addEventListener("click", () => {
  closeMenu();
  const t = terms.get(active) || terms.get(paneA);
  if (t) { copySel(t); t.term.focus(); }
});
$("#fsMinus").addEventListener("click", () => setFont(font - 1));
$("#fsPlus").addEventListener("click", () => setFont(font + 1));

document.addEventListener("mousedown", ev => {
  if ($("#menu").hidden) return;
  if (!$("#menu").contains(ev.target) && !$("#bMore").contains(ev.target)) closeMenu();
}, true);
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape" || $("#menu").hidden) return;
  closeMenu();
}, true);

$("#tabs").addEventListener("keydown", ev => {
  if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  const slots = [...terms.keys()];
  const i = slots.indexOf(active);
  if (i < 0) return;
  ev.preventDefault();
  const d = ev.key === "ArrowRight" ? 1 : -1;
  const next = slots[(i + d + slots.length) % slots.length];
  focusSlot(next);
  scrollTab(terms.get(next).tab);
});

/* touch keyboard helpers */
const QUICK = { esc: "\x1b", tab: "\t", cc: "\x03", up: "\x1b[A", down: "\x1b[B" };
$("#keys").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-k]");
  if (!b) return;
  if (b.dataset.k === "paste") { pasteActive(); return; }
  const t = terms.get(active) || terms.get(paneA);
  if (t) { sendStr(t, QUICK[b.dataset.k] || ""); t.term.focus(); }
});

/* ---------------------------------------------------------------- boot */
function restore() {
  let st = null;
  try { st = JSON.parse(store.get(UI_KEY) || "null"); } catch (e) {}
  const open = [];
  if (st && Array.isArray(st.slots)) {
    for (const s of st.slots) {
      if (Number.isInteger(s) && s >= 1 && s <= SLOTS && open.indexOf(s) < 0) open.push(s);
    }
  }
  if (!open.length) { openSlot(1); return; }
  for (const s of open) openSlot(s);
  const set = new Set(open);
  const a = set.has(st.paneA) ? st.paneA : open[0];
  const b = set.has(st.paneB) && st.paneB !== a ? st.paneB : 0;
  paneA = a; paneB = b;
  active = (set.has(st.active) && (st.active === a || st.active === b)) ? st.active : a;
}

async function loadInfo() {
  try {
    const r = await tf("/info");
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.slots >= 1) SLOTS = Math.min(12, j.slots | 0);
  } catch (e) {}
}

function fontsReady() {
  if (!document.fonts) return Promise.resolve();
  return document.fonts.ready.then(() => Promise.all([
    document.fonts.load('15px "VazirTerm"', "سلام"),
    document.fonts.load('bold 15px "VazirTerm"', "سلام"),
  ])).catch(() => {});
}

(async () => {
  await loadInfo();
  await fontsReady();
  restore();
  layout();
  document.body.classList.add("ready");
  if (matchMedia("(pointer:fine)").matches) focusTerm(active);
  setTimeout(() => { fitSlot(paneA); fitSlot(paneB); }, 60);
  window.__termApp = {
    terms, openSlot, closeSlot, toggleSplit,
    get state() { return { paneA, paneB, active, SLOTS }; },
  };
})();

})();

</script>
</body>
</html>
